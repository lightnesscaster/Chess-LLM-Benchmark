services:
  - type: web
    name: chess-llm-benchmark
    runtime: python
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    disk:
      name: codex-auth
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FIREBASE_ENABLED
        value: "true"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        value: "johnstondaniel4@gmail.com"
      - key: HUMAN_GAME_DISPLAY_ALIASES
        value: '{"johnstondaniel4@gmail.com":"the39clues"}'
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CODEX_HOME
        value: /var/data/codex
      - key: CODEX_AUTH_JSON_B64
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: DISABLE_AUTOUPDATER
        value: "1"
      # FIREBASE_CREDENTIALS_JSON must be set manually in Render dashboard
      # Copy the contents of firebase-key.json as the value
